<ion-header class="njambo-page-header"><ion-toolbar><div class="header-grid"><button type="button" class="square menu" (click)="openMenu()" aria-label="Ouvrir le menu"><ion-icon name="menu"></ion-icon></button><button *ngIf="showBack" type="button" class="square back" (click)="back()" aria-label="Retour"><ion-icon name="chevron-back"></ion-icon></button><a class="identity" routerLink="/profile"><img [src]="avatarUrl" [alt]="'Avatar de '+username"><span><strong>{{username}}</strong><small><ion-icon name="shield-checkmark"></ion-icon> Joueur Njambo</small></span></a><h1>{{title}}</h1><a class="wallet" routerLink="/transactions"><small>Solde Njambo</small><strong>{{balance|number:'1.0-2':'fr'}}</strong></a><a *ngIf="showAdd" class="square add" routerLink="/new-table" aria-label="Créer une partie"><ion-icon name="add"></ion-icon></a></div></ion-toolbar></ion-header>
