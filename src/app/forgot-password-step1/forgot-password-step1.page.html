<ion-content scrollY="true">
    <div class="main">
        <button type="button" class="back-button" routerLink="/login" aria-label="Retour à la connexion">
            <ion-icon name="arrow-back-outline"></ion-icon>
        </button>

        <div class="brand">
            <img src="../../assets/images/njambo-logo.webp" width="960" height="640" alt="Njambo – Jeux de cartes">
        </div>

        <section class="auth-panel">
            <div class="security-icon"><ion-icon name="key-outline"></ion-icon></div>
            <div class="page-title">
                <h1>Mot de passe oublié ?</h1>
                <p>Indiquez l’adresse liée à votre compte. Nous vous enverrons un code sécurisé valable 15 minutes.</p>
            </div>

            <form [formGroup]="forgotPasswordStep1FormGroup" (ngSubmit)="checkEmail()">
                <div class="item-container" [class.invalid]="forgotPasswordStep1FormGroup.get('email')?.touched && forgotPasswordStep1FormGroup.get('email')?.invalid">
                    <ion-item lines="none">
                        <ion-icon class="input-icon" slot="start" name="mail-outline"></ion-icon>
                        <ion-input formControlName="email" type="email" inputmode="email" autocomplete="email" placeholder="Votre adresse e-mail"></ion-input>
                    </ion-item>
                </div>
                <p class="field-error" *ngIf="forgotPasswordStep1FormGroup.get('email')?.touched && forgotPasswordStep1FormGroup.get('email')?.invalid">Saisissez une adresse e-mail valide.</p>

                <button type="submit" class="primary-button" [disabled]="forgotPasswordStep1FormGroup.invalid">
                    <span>Recevoir mon code</span>
                    <ion-icon name="arrow-forward-outline"></ion-icon>
                </button>
            </form>

            <div class="helper-link">Vous avez déjà reçu un code ? <a [routerLink]="['/forgot-password-step2']">Le saisir maintenant</a></div>
            <div class="login-link"><a [routerLink]="['/login']"><ion-icon name="log-in-outline"></ion-icon> Retour à la connexion</a></div>
        </section>
    </div>
</ion-content>
