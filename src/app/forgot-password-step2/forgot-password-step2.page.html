<ion-content scrollY="true">
    <div class="main">
        <button type="button" class="back-button" routerLink="/forgot-password-step1" aria-label="Retour à l’étape précédente">
            <ion-icon name="arrow-back-outline"></ion-icon>
        </button>

        <div class="brand">
            <img src="../../assets/images/njambo-logo.webp" width="960" height="640" alt="Njambo – Jeux de cartes">
        </div>

        <section class="auth-panel">
            <div class="security-icon"><ion-icon name="shield-checkmark-outline"></ion-icon></div>
            <div class="page-title">
                <h1>Créer un nouveau mot de passe</h1>
                <p>Entrez le code reçu par e-mail, puis choisissez un mot de passe d’au moins 8 caractères.</p>
            </div>

            <form [formGroup]="forgotPasswordStep2FormGroup" (ngSubmit)="reset()">
                <div class="item-container">
                    <ion-item lines="none">
                        <ion-icon class="input-icon" slot="start" name="mail-outline"></ion-icon>
                        <ion-input formControlName="email" type="email" inputmode="email" autocomplete="email" placeholder="Votre adresse e-mail"></ion-input>
                    </ion-item>
                </div>
                <div class="item-container code-field">
                    <ion-item lines="none">
                        <ion-icon class="input-icon" slot="start" name="keypad-outline"></ion-icon>
                        <ion-input formControlName="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Code à 6 chiffres"></ion-input>
                    </ion-item>
                </div>
                <div class="item-container">
                    <ion-item lines="none">
                        <ion-icon class="input-icon" slot="start" name="lock-closed-outline"></ion-icon>
                        <ion-input formControlName="password" [type]="passwordType" autocomplete="new-password" placeholder="Nouveau mot de passe"></ion-input>
                        <ion-icon class="password-icon" slot="end" [name]="passwordIconName" (click)="changePasswordType()"></ion-icon>
                    </ion-item>
                </div>
                <div class="item-container">
                    <ion-item lines="none">
                        <ion-icon class="input-icon" slot="start" name="checkmark-circle-outline"></ion-icon>
                        <ion-input formControlName="confirmPassword" [type]="passwordType" autocomplete="new-password" placeholder="Confirmer le mot de passe"></ion-input>
                    </ion-item>
                </div>
                <p class="password-hint"><ion-icon name="information-circle-outline"></ion-icon> 8 caractères minimum</p>

                <button type="submit" class="primary-button" [disabled]="forgotPasswordStep2FormGroup.invalid">
                    <span>Modifier mon mot de passe</span>
                    <ion-icon name="checkmark-outline"></ion-icon>
                </button>
            </form>

            <div class="helper-link">Code non reçu ou expiré ? <a [routerLink]="['/forgot-password-step1']">Renvoyer un code</a></div>
            <div class="login-link"><a [routerLink]="['/login']"><ion-icon name="log-in-outline"></ion-icon> Retour à la connexion</a></div>
        </section>
    </div>
</ion-content>
