<app-page-header title="Règles des jeux"></app-page-header>
<ion-content fullscreen="true"><div class="main"><div class="game-choice"><div class="game-choice-title"><span>Choisis le jeu</span><small>Consulte les règles de chaque jeu</small></div><nav class="game-tabs" aria-label="Choisir les règles d'un jeu"><button *ngFor="let game of games" [class.active]="selected.id===game.id" (click)="select(game)"><ion-icon [name]="gameIcon(game.id)"></ion-icon><strong>{{game.name}}</strong></button></nav></div><section class="hero"><div class="hero-top"><div><div class="eyebrow">Comment jouer</div><h2>{{selected.name}}</h2><p>{{selected.summary}}</p></div><div class="hero-emblem"><span>♠</span><strong>NJAMBO</strong></div></div><div class="hero-stats"><div *ngFor="let stat of selected.stats"><strong>{{stat}}</strong></div></div></section><section class="rule-card" *ngFor="let rule of selected.rules;let i=index" [class.highlight]="i===selected.rules.length-1"><div class="rule-index">{{i+1}}</div><div class="rule-body"><h3>{{rule.title}}</h3><p>{{rule.text}}</p></div></section></div></ion-content><app-bottom-nav active="menu"></app-bottom-nav>
