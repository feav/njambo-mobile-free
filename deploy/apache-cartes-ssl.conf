<IfModule mod_ssl.c>
<VirtualHost 217.160.193.48:443>
    ServerName game.njambo.fr
    DocumentRoot /var/www/njambo/game

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/game.njambo.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/game.njambo.fr/privkey.pem
    Protocols h2 http/1.1

    <Directory /var/www/njambo/game>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        <FilesMatch "\.(css|js|webp|png|jpg|jpeg|svg|woff2)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <FilesMatch "^(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/njambo-game-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/njambo-game-ssl-access.log combined
</VirtualHost>
</IfModule>
