<VirtualHost 217.160.193.48:80>
    ServerName games.njambo.fr
    DocumentRoot /var/www/njambo/game

    <Directory /var/www/njambo/game>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://games.njambo.fr%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/njambo-game-error.log
    CustomLog ${APACHE_LOG_DIR}/njambo-game-access.log combined
</VirtualHost>
